name: CI

# 每次 PR 与主干推送都跑：单测 + 能否出包。
# 这里刻意不碰签名——debug 包不需要密钥，CI 也不该拿到发布私钥。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 补齐钉住的 NDK（终端模块 libpty.so 需要）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4

      - name: 单测 + debug 构建
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: 未签名时拒绝出 release（防回归：生产包必须签名）
        run: |
          if ./gradlew --no-daemon :app:assembleRelease >out.log 2>&1; then
            echo "没有签名材料却构建成功了，说明拦截失效" >&2
            exit 1
          fi
          grep -q "keystore.properties\|AOS_SIGNING" out.log

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
