name: Release

# 打 tag（v1.2.3）或手动触发即出版本：签名构建 → 验签 → 生成 update.json → 建 GitHub Release。
# 应用内"检查更新"读的就是这里产出的 update.json，所以两边的字段与文件名必须一起改。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（默认当前 ref）
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 补齐钉住的 NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4

      - name: 解析版本号（tag v1.2.3 → name 1.2.3 / code 10203）
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) : ;;
            *) echo "tag 必须以 v 开头，收到 $TAG" >&2; exit 1 ;;
          esac
          NAME="${TAG#v}"
          MAJOR=$(echo "$NAME" | cut -d. -f1)
          MINOR=$(echo "$NAME" | cut -sd. -f2 || true); MINOR=${MINOR:-0}
          PATCH=$(echo "$NAME" | cut -sd. -f3 || true); PATCH=${PATCH:-0}
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "name=$NAME" >>"$GITHUB_OUTPUT"
          echo "code=$CODE" >>"$GITHUB_OUTPUT"

      - name: 还原签名材料（只存在于本次构建的工作目录）
        env:
          KEYSTORE_B64: ${{ secrets.AOS_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.AOS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AOS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AOS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "缺少 AOS_KEYSTORE_B64 / AOS_KEYSTORE_PASSWORD / AOS_KEY_ALIAS secrets" >&2
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/aos-release.jks
          {
            echo "storeFile=keystore/aos-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } > keystore.properties

      - name: 签名构建
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PVERSION_CODE=${{ steps.ver.outputs.code }} \
            -PVERSION_NAME=${{ steps.ver.outputs.name }}

      - name: 验签（签不上就不出版）
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "aos-agent-${{ steps.ver.outputs.name }}.apk"

      - name: 生成 update.json（应用内检查更新的清单）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="aos-agent-${{ steps.ver.outputs.name }}.apk"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > update.json <<JSON
          {
            "versionCode": ${{ steps.ver.outputs.code }},
            "versionName": "${{ steps.ver.outputs.name }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/${APK}",
            "sha256": "${SHA}",
            "notes": "${{ steps.ver.outputs.tag }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat update.json

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "aos-agent-${{ steps.ver.outputs.name }}.apk" update.json --clobber
          else
            gh release create "$TAG" \
              "aos-agent-${{ steps.ver.outputs.name }}.apk" update.json \
              --title "$TAG" --notes "aos-agent $TAG（签名 release APK + 更新清单）"
          fi
